name: Release standalone Agent runtime

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Verify source and release version
        shell: bash
        run: |
          npm run check
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Build standalone runtimes
        shell: bash
        run: |
          mkdir -p dist
          bun build --compile --target=bun-darwin-arm64 plugins/mediaclaw/scripts/runtime-entry.mjs --outfile dist/mediaclaw-agent-darwin-arm64
          bun build --compile --target=bun-darwin-x64 plugins/mediaclaw/scripts/runtime-entry.mjs --outfile dist/mediaclaw-agent-darwin-x64
          bun build --compile --target=bun-linux-arm64 plugins/mediaclaw/scripts/runtime-entry.mjs --outfile dist/mediaclaw-agent-linux-arm64
          bun build --compile --target=bun-linux-x64-baseline plugins/mediaclaw/scripts/runtime-entry.mjs --outfile dist/mediaclaw-agent-linux-x64
          cd dist
          sha256sum mediaclaw-agent-* > checksums.txt

      - name: Attest runtime provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/mediaclaw-agent-*"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/mediaclaw-agent-*
            dist/checksums.txt
